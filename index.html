<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080d18" />
    <meta name="description" content="BoneVista anatomy workspace" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>BoneVista</title>
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;display:grid;place-items:center;background:#080d18;color:#eef3ff;font:15px system-ui,sans-serif;padding:24px;box-sizing:border-box">
        <section style="max-width:560px;padding:32px;border:1px solid #263753;border-radius:12px;background:#0e1625">
          <p style="color:#7da2ff;font:12px ui-monospace,monospace;letter-spacing:.12em">BONEVISTA</p>
          <h1 style="font-size:24px">Start the local app server</h1>
          <p>Opening this project file directly does not load its application modules. In the project folder, run:</p>
          <pre style="padding:14px;background:#080d18;color:#9bb7ff;border-radius:6px;white-space:pre-wrap">npm install
npm run dev -- --open</pre>
          <p>Or double-click <code>start.bat</code>. Then open the local address printed by Vite.</p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
