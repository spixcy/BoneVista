<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="BoneVista — an interactive 3D anatomy and biomechanics workspace that runs privately in your browser." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>BoneVista — 3D Anatomy Workspace</title>
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;display:grid;place-items:center;background:#050505;color:#f6f3eb;font:15px system-ui,sans-serif;padding:24px;box-sizing:border-box">
        <section style="max-width:560px;padding:32px;border:1px solid rgba(212,175,55,.35);border-radius:12px;background:#0b0b0b">
          <p style="color:#d4af37;font:12px ui-monospace,monospace;letter-spacing:.12em">BONEVISTA</p>
          <h1 style="font-size:24px">Start the local app server</h1>
          <p>Opening this project file directly does not load its application modules. In the project folder, run:</p>
          <pre style="padding:14px;background:#050505;color:#f1d78a;border-radius:6px;white-space:pre-wrap">npm install
npm run dev -- --open</pre>
          <p>Or double-click <code>start.bat</code>. Then open the local address printed by Vite.</p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
